<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t">
  <title id="t">Authelia Admin: web UI to manage Authelia</title>
  <rect width="1280" height="640" fill="#14161b"/>
  <rect x="0" y="600" width="1280" height="40" fill="#1e2235"/>

{% extends "base.html" %}
{% from "_icons.html" import ic %}
{% block body %}
<div style="text-align:center;margin-bottom:1.25rem">
  <img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="64" height="64" style="display:block;margin:0 auto .75rem">
  <h1 style="margin:0">Two-step check</h1>
  <div style="color:var(--mut)">Enter the 6-digit code from your authenticator app</div>
</div>
<div class="card">
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label style="margin-top:0">Code</label>
    <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" autofocus required placeholder="123456" style="font-size:1.3rem;letter-spacing:.2em;text-align:center">
    <div class="row"><button class="btn grow">Verify</button></div>
    <div class="row" style="justify-content:center;margin-top:.75rem"><a href="{{ url_for('login') }}">Back to sign in</a></div>
  </form>
</div>
{% endblock %}

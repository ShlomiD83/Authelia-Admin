name: Build and push image

# Builds the multi-arch image (amd64 + arm64) and pushes it to Docker Hub and the GitHub Container Registry:
#   docker.io/<DOCKERHUB_USERNAME>/authelia-admin   and   ghcr.io/<repository owner, lowercase>/authelia-admin
#  - manually (Actions tab > Run workflow, or `gh workflow run docker.yml`) -> rebuilds latest with the
#    newest Authelia release and base-image patches
#  - on a version tag (v1.2.3) you push yourself -> tags latest, 1.2.3, 1.2
#  - from the weekly CVE check (cve-check.yml), only when it finds fixable vulnerabilities
#  - after Dependabot auto-merges a Python or editor package update (dependabot-automerge.yml)
# Each platform image is smoke-tested (tests/smoke-test.sh) on its own runner before anything is pushed;
# if a test fails, nothing is published.
# It has no schedule of its own. Each build overwrites only `latest` and also gets its own permanent tag with
# the build date and time in UTC (e.g. 2026.11.18-1408), so you can pin a known-good image or roll back.
# Both registries always get the same tags.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   your Docker Hub user name
#   DOCKERHUB_TOKEN      a Docker Hub access token with Read & Write scope
# GHCR uses the workflow's own GITHUB_TOKEN (permission packages: write); no secret needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:   # used by the weekly CVE check (cve-check.yml) when it finds fixable vulnerabilities

permissions:
  contents: read
  packages: write   # push to ghcr.io

# One build at a time; a newer request waits (and replaces an older waiting one) instead of running
# in parallel, so the last build always publishes the latest code.
concurrency:
  group: image-build
  cancel-in-progress: false

env:
  IMAGE_NAME: authelia-admin

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          # Native arm64 runner: free for public repositories. Compiling Authelia under QEMU emulation
          # on an amd64 runner works too but is very slow.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # Changes daily, so a run on a new day re-fetches the latest Authelia release and dependencies
          # instead of reusing a cached build stage.
          echo "BUILD_STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels: org.opencontainers.image.source links the GHCR package to this repository
      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}

      # Build into the local Docker first and run the smoke test (tests/smoke-test.sh). Nothing is pushed
      # unless it passes; the push below then reuses the build cache, so the image isn't built twice.
      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: BUILD_STAMP=${{ env.BUILD_STAMP }}
          load: true
          provenance: false
          tags: authelia-admin:test
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Smoke test
        run: bash tests/smoke-test.sh authelia-admin:test

      - name: Build and push by digest (both registries)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: BUILD_STAMP=${{ env.BUILD_STAMP }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch tags
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Prepare
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "DOCKERHUB_IMAGE=docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY.MM.DD-HHmm'}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The per-platform images were pushed to both registries, so one command creates every tag in both
      - name: Create and push the manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${DOCKERHUB_IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:latest"
          docker buildx imagetools inspect "${GHCR_IMAGE}:latest"

  # Keep the registries tidy: the images behind the newest KEEP tags stay (latest is always on the newest),
  # older ones go. A cleanup problem never fails the build: the image is already published.
  cleanup:
    name: Clean up old images
    runs-on: ubuntu-latest
    needs: merge
    continue-on-error: true
    env:
      KEEP: 5
    steps:
      # GHCR: also removes untagged leftovers. The action is multi-arch aware, so the platform images and
      # attestations that a kept tag uses stay.
      - name: GHCR
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ env.IMAGE_NAME }}
          keep-n-tagged: ${{ env.KEEP }}
          exclude-tags: latest
          delete-untagged: true
          validate: true

      # Needs a Docker Hub access token with Read, Write & Delete scope in the DOCKERHUB_CLEANUP_TOKEN secret
      # (the build token only needs Read & Write). Without it this step is skipped.
      - name: Docker Hub dated tags beyond the newest ${{ env.KEEP }}
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_CLEANUP_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ]; then
            echo "::notice::Docker Hub cleanup skipped: add a DOCKERHUB_CLEANUP_TOKEN secret (Read, Write & Delete) to enable it."
            exit 0
          fi
          repo="$HUB_USER/$IMAGE_NAME"
          jwt=$(curl -fsS -X POST https://hub.docker.com/v2/auth/token -H 'Content-Type: application/json' \
                -d "$(jq -n --arg u "$HUB_USER" --arg t "$HUB_TOKEN" '{identifier:$u, secret:$t}')" | jq -r .access_token)
          [ -n "$jwt" ] && [ "$jwt" != null ] || { echo "::error::Docker Hub sign-in failed"; exit 1; }
          # dated tags (2026.11.21-0617, or the older 2026.11.18 form), newest first; keep the first $KEEP
          tags=$(curl -fsS "https://hub.docker.com/v2/repositories/$repo/tags?page_size=100" \
                 | jq -r '.results[].name' | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]{4})?$' | sort -r)
          echo "Dated tags on Docker Hub:"; echo "$tags" | sed 's/^/  /'
          echo "$tags" | tail -n +$((KEEP + 1)) | while read -r t; do
            [ -n "$t" ] || continue
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $jwt" \
                   "https://hub.docker.com/v2/repositories/$repo/tags/$t")
            echo "deleted $t (HTTP $code)"
          done

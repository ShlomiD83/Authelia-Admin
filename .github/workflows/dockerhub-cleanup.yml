name: Docker Hub cleanup

# Manual clean-up of old images on Docker Hub (Actions tab > Docker Hub cleanup > Run workflow).
# Keeps the newest N images (default 3). The image `latest` points to always stays, with its dated tag.
# Every image build also trims Docker Hub and GHCR to the newest 3 (KEEP in docker.yml).
#
# Needs the DOCKERHUB_CLEANUP_TOKEN secret: a Docker Hub access token with Read, Write & Delete scope.

on:
  workflow_dispatch:
    inputs:
      keep:
        description: Images to keep, including the latest (at least 1)
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: image-build   # never at the same time as an image build
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete old Docker Hub tags
    runs-on: ubuntu-latest
    steps:
      - name: Delete
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_CLEANUP_TOKEN }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          [ -n "$HUB_TOKEN" ] || { echo "::error::Add a DOCKERHUB_CLEANUP_TOKEN secret (Read, Write & Delete)."; exit 1; }
          repo="$HUB_USER/authelia-admin"
          jwt=$(curl -fsS -X POST https://hub.docker.com/v2/auth/token -H 'Content-Type: application/json' \
                -d "$(jq -n --arg u "$HUB_USER" --arg t "$HUB_TOKEN" '{identifier:$u, secret:$t}')" | jq -r .access_token)
          [ -n "$jwt" ] && [ "$jwt" != null ] || { echo "::error::Docker Hub sign-in failed"; exit 1; }
          list=$(curl -fsS "https://hub.docker.com/v2/repositories/$repo/tags?page_size=100")
          latest=$(echo "$list" | jq -r '.results[] | select(.name=="latest") | .digest')
          [ -n "$latest" ] && [ "$latest" != null ] || { echo "::error::No latest tag found; nothing deleted."; exit 1; }
          # dated tags, newest first; the one that is the same image as latest always stays
          dated=$(echo "$list" | jq -r --arg d "$latest" \
                  '.results[] | select(.name | test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}(-[0-9]{4})?$")) | select(.digest != $d) | .name' | sort -r)
          echo "latest: $latest ($(echo "$list" | jq -r --arg d "$latest" '[.results[] | select(.digest==$d and .name!="latest") | .name] | join(", ")'))"
          echo "Other dated tags:"; echo "${dated:-  (none)}" | sed 's/^/  /'
          [ "$KEEP" -ge 1 ] || KEEP=1
          echo "$dated" | tail -n +$KEEP | while read -r t; do
            [ -n "$t" ] || continue
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $jwt" \
                   "https://hub.docker.com/v2/repositories/$repo/tags/$t")
            echo "deleted $t (HTTP $code)"
            [ "$code" = 204 ] || [ "$code" = 200 ] || exit 1
          done
          echo "### Docker Hub tags now" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "https://hub.docker.com/v2/repositories/$repo/tags?page_size=100" | jq -r '.results[].name' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

# Weekly pull requests for outdated or vulnerable dependencies. Nothing is merged automatically: each
# pull request gets a test build, and you are notified to review and merge it
# (see workflows/dependabot-check.yml).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # CodeMirror and esbuild for the configuration editor (bundled into the image)
  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*", "@replit/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

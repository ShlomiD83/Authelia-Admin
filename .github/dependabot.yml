# Weekly pull requests for outdated or vulnerable dependencies. Nothing is merged automatically:
# review the pull request, merge it, then run the image workflow (or wait for the weekly CVE check).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
